<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CyberShield AI — India Threat Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#04070e;color:#d4e2f0;font-family:'DM Sans',system-ui,sans-serif;font-size:13.5px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 45% at 10% 0%,rgba(6,182,212,0.055) 0%,transparent 50%),radial-gradient(ellipse 40% 35% at 90% 95%,rgba(139,92,246,0.03) 0%,transparent 45%);background-image:radial-gradient(circle,rgba(255,255,255,0.014) 1px,transparent 1px);background-size:28px 28px}
#root{position:relative;z-index:1}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(6,182,212,0.2);border-radius:10px}
/* SHELL */
.shell{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:228px;flex-shrink:0;background:linear-gradient(180deg,rgba(7,12,23,0.99),rgba(5,9,18,0.99));border-right:1px solid rgba(255,255,255,0.048);display:flex;flex-direction:column;z-index:50;position:relative}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(6,182,212,0.1) 30%,rgba(6,182,212,0.1) 70%,transparent);pointer-events:none}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid rgba(255,255,255,0.048);flex-shrink:0}
.sb-mark{width:28px;height:28px;background:linear-gradient(145deg,#06b6d4,rgba(6,182,212,0.5));border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px rgba(6,182,212,0.2),inset 0 1px 0 rgba(255,255,255,0.15);font-size:0.75rem;color:#04070e;font-weight:700}
.sb-txt{font-size:0.85rem;font-weight:700;color:#eaf0fc;line-height:1.1}
.sb-txt b{color:#06b6d4}
.sb-sub{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:#344d68;letter-spacing:0.12em;text-transform:uppercase}
.sb-sec{font-family:'JetBrains Mono',monospace;font-size:0.54rem;font-weight:500;color:#344d68;text-transform:uppercase;letter-spacing:0.14em;padding:16px 16px 5px}
.sb-divider{height:1px;background:rgba(255,255,255,0.048);margin:4px 12px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:#607e9a;font-size:0.8rem;font-weight:500;transition:all 0.15s;position:relative;font-family:'DM Sans',sans-serif}
.nav-item:hover{color:#d4e2f0;background:rgba(255,255,255,0.025)}
.nav-item.active{color:#06b6d4;background:rgba(6,182,212,0.08)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:#06b6d4;border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(6,182,212,0.4)}
.nav-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:0.8rem;flex-shrink:0;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.048)}
.nav-item.active .nav-icon{background:rgba(6,182,212,0.1);border-color:rgba(6,182,212,0.18)}
.nav-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:0.52rem;padding:1px 5px;border-radius:100px}
.sb-foot{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,0.048)}
.sb-pill{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.15);border-radius:100px;padding:4px 9px;font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:#10b981}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;animation:pulse 2.5s ease-in-out infinite}
.dot-g{background:#10b981;box-shadow:0 0 5px #10b981}
.dot-r{background:#ef4444;box-shadow:0 0 5px #ef4444}
.dot-a{background:#f59e0b;box-shadow:0 0 5px #f59e0b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
/* MAIN */
.main-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.048);background:rgba(4,7,14,0.9);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:40}
.bc{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:#344d68}
.bc-cur{color:#d4e2f0;font-weight:500}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-badge{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:500}
.tb-clean{background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.18);color:#10b981}
.tb-alert{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.22);color:#ef4444}
.tb-time{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:#344d68;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.048);border-radius:5px;padding:3px 9px}
.page-area{flex:1;overflow-y:auto;padding:20px 24px}
/* PAGE */
.page{animation:pageIn 0.25s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.pg-head{margin-bottom:18px}
.pg-title{font-size:1.25rem;font-weight:700;color:#eaf0fc;letter-spacing:-0.025em;margin-bottom:2px}
.pg-sub{font-size:0.74rem;color:#607e9a}
/* CARDS */
.card{background:rgba(7,12,23,0.97);border:1px solid rgba(255,255,255,0.048);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;backdrop-filter:blur(20px);transition:border-color 0.2s}
.card:hover{border-color:rgba(255,255,255,0.09)}
.card-sm{padding:12px 14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-family:'JetBrains Mono',monospace;font-size:0.59rem;font-weight:500;color:#607e9a;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:6px}
.cd{width:5px;height:5px;border-radius:50%;background:#06b6d4;box-shadow:0 0 6px rgba(6,182,212,0.5)}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:7px}
.spacer{flex:1}
.mb8{margin-bottom:8px}
.mb12{margin-bottom:12px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:7px;font-size:0.76rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.btn-primary{background:#06b6d4;color:#04070e;box-shadow:0 2px 10px rgba(6,182,212,0.22)}
.btn-primary:hover{background:#22d3ee;transform:translateY(-1px);box-shadow:0 4px 16px rgba(6,182,212,0.32)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.09);color:#607e9a}
.btn-ghost:hover{color:#d4e2f0;border-color:rgba(255,255,255,0.13)}
.btn-sm{padding:5px 11px;font-size:0.7rem}
.btn-xs{padding:4px 9px;font-size:0.66rem}
.btn-wa{background:#25d366;color:#000}
.btn-wa:hover{background:#1fba58;transform:translateY(-1px)}
/* TAGS */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:0.57rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap}
.t-c{background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.22);color:#06b6d4}
.t-g{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.22);color:#10b981}
.t-r{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.22);color:#ef4444}
.t-y{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.22);color:#f59e0b}
.t-v{background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.22);color:#8b5cf6}
.t-d{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.07);color:#607e9a}
/* KPI */
.kpi{background:rgba(7,12,23,0.97);border:1px solid rgba(255,255,255,0.048);border-radius:11px;padding:12px 14px;position:relative;overflow:hidden;transition:all 0.2s}
.kpi:hover{border-color:rgba(255,255,255,0.09);transform:translateY(-1px)}
.kpi-line{position:absolute;top:0;left:0;right:0;height:1px}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:1.35rem;font-weight:600;letter-spacing:-0.02em;color:#eaf0fc;line-height:1;margin-bottom:3px;transition:color 0.4s}
.kpi-val.dim{color:#344d68}
.kpi-lbl{font-size:0.63rem;color:#607e9a}
/* RISK BAR */
.rbar{margin-bottom:10px}
.rbar-row{display:flex;justify-content:space-between;margin-bottom:4px}
.rbar-name{font-size:0.7rem;color:#607e9a}
.rbar-pct{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600}
.rbar-track{height:4px;background:rgba(255,255,255,0.05);border-radius:100px;overflow:hidden}
.rbar-fill{height:100%;border-radius:100px;transition:width 1.3s cubic-bezier(0.23,1,0.32,1)}
.rf-s{background:#10b981}
.rf-w{background:#f59e0b}
.rf-d{background:#ef4444}
/* VERDICT */
.verdict{display:flex;align-items:center;gap:12px;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.verdict.safe{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.18)}
.verdict.warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.18)}
.verdict.danger{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.22)}
.v-icon{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}
.verdict.safe .v-icon{background:rgba(16,185,129,0.12)}
.verdict.warn .v-icon{background:rgba(245,158,11,0.12)}
.verdict.danger .v-icon{background:rgba(239,68,68,0.12)}
.v-label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1px}
.verdict.safe .v-label{color:#10b981}
.verdict.warn .v-label{color:#f59e0b}
.verdict.danger .v-label{color:#ef4444}
.v-score{font-size:1.4rem;font-weight:700;letter-spacing:-0.03em;line-height:1}
.verdict.safe .v-score{color:#10b981}
.verdict.warn .v-score{color:#f59e0b}
.verdict.danger .v-score{color:#ef4444}
.v-desc{font-size:0.72rem;color:#607e9a;margin-top:1px}
/* FLAGS */
.flags{display:flex;flex-direction:column}
.flag{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.048)}
.flag:last-child{border-bottom:none}
.flag-dot{width:5px;height:5px;border-radius:50%;margin-top:4px;flex-shrink:0}
.fd-hi{background:#ef4444;box-shadow:0 0 5px #ef4444}
.fd-md{background:#f59e0b;box-shadow:0 0 5px #f59e0b}
.fd-lo{background:#344d68}
.flag-txt{font-size:0.74rem;color:#d4e2f0;line-height:1.5}
/* FORM */
.textarea{width:100%;background:#0a1222;border:1px solid rgba(255,255,255,0.09);border-radius:7px;padding:11px 13px;color:#eaf0fc;font-family:'JetBrains Mono',monospace;font-size:0.74rem;line-height:1.7;resize:vertical;min-height:110px;outline:none;transition:border-color 0.15s}
.textarea:focus{border-color:rgba(6,182,212,0.32)}
.textarea::placeholder{color:#344d68}
.select{width:100%;background:#0a1222;border:1px solid rgba(255,255,255,0.09);border-radius:7px;padding:8px 11px;color:#eaf0fc;font-family:'DM Sans',sans-serif;font-size:0.78rem;outline:none;transition:border-color 0.15s;cursor:pointer}
.select:focus{border-color:rgba(6,182,212,0.32)}
.field-label{font-family:'JetBrains Mono',monospace;font-size:0.57rem;color:#607e9a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;display:block}
/* UPLOAD ZONE */
.drop-zone{border:1px dashed rgba(255,255,255,0.1);border-radius:11px;padding:30px 16px;text-align:center;cursor:pointer;background:rgba(255,255,255,0.025);transition:all 0.2s}
.drop-zone:hover{border-color:rgba(6,182,212,0.4);background:rgba(6,182,212,0.05)}
.drop-zone h4{font-size:0.85rem;font-weight:600;color:#d4e2f0;margin-bottom:3px;margin-top:8px}
.drop-zone p{font-size:0.7rem;color:#607e9a}
.drop-zone p em{color:#06b6d4;font-style:normal}
/* FILE CHIP */
.file-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.09);border-radius:6px;padding:8px 11px;margin-top:9px}
.fc-name{font-size:0.76rem;font-weight:600;color:#d4e2f0}
.fc-meta{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#344d68}
/* WAIT / PROC */
.wait-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 20px;gap:9px;text-align:center;border:1px dashed rgba(255,255,255,0.07);border-radius:11px;background:rgba(255,255,255,0.012)}
.wait-icon{font-size:2.2rem;opacity:0.35;margin-bottom:3px}
.wait-title{font-size:0.9rem;font-weight:600;color:#607e9a}
.wait-sub{font-size:0.72rem;color:#344d68;max-width:230px;line-height:1.6}
.wait-hint{font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:#344d68;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.048);border-radius:100px;padding:3px 10px;text-transform:uppercase;letter-spacing:0.05em}
.proc-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:38px 20px;text-align:center}
.spinner{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.08);border-top-color:#06b6d4;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-label{font-size:0.8rem;color:#d4e2f0;font-weight:500}
.proc-sub{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#344d68;max-width:270px;line-height:1.7}
/* HERO */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(6,182,212,0.045),rgba(139,92,246,0.025));border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:26px 30px 22px;margin-bottom:16px}
.hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(6,182,212,0.3),rgba(139,92,246,0.18),transparent);pointer-events:none}
.hero-ew{display:inline-flex;align-items:center;gap:6px;background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.18);border-radius:100px;padding:3px 11px;margin-bottom:11px;font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:#06b6d4;text-transform:uppercase;letter-spacing:0.1em}
.hero h1{font-size:clamp(1.45rem,2.6vw,2.1rem);font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:#eaf0fc;margin-bottom:8px}
.hero h1 span{color:#06b6d4}
.hero p{font-size:0.82rem;color:#607e9a;max-width:480px;line-height:1.7;margin-bottom:16px}
/* FEATURE GRID */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.feat-card{background:rgba(7,12,23,0.97);border:1px solid rgba(255,255,255,0.048);border-radius:11px;padding:14px;cursor:pointer;transition:all 0.2s}
.feat-card:hover{border-color:rgba(255,255,255,0.1);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.32)}
.feat-icon{width:32px;height:32px;border-radius:7px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:0.85rem;margin-bottom:9px}
.feat-card h4{font-size:0.8rem;font-weight:700;color:#eaf0fc;margin-bottom:3px}
.feat-card p{font-size:0.68rem;color:#607e9a;line-height:1.55}
.feat-arr{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:#344d68;transition:color 0.15s}
.feat-card:hover .feat-arr{color:#06b6d4}
/* TIMELINE */
.tl-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.048)}
.tl-row:last-child{border-bottom:none}
.tl-dot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex-shrink:0}
.tl-body{flex:1}
.tl-title{font-size:0.76rem;font-weight:500;color:#d4e2f0;margin-bottom:1px}
.tl-meta{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:#344d68}
/* CONF BARS */
.conf-row{margin-bottom:9px}
.conf-hd{display:flex;justify-content:space-between;margin-bottom:3px}
.conf-name{font-size:0.7rem;color:#607e9a}
.conf-pct{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600}
/* WAVEFORM */
.wave-canvas{width:100%;height:62px;display:block;background:rgba(255,255,255,0.02);border-radius:6px;border:1px solid rgba(255,255,255,0.048)}
/* WEBCAM */
.cam-frame{position:relative;border-radius:10px;overflow:hidden;background:#0a1222;aspect-ratio:16/10;border:1px solid rgba(255,255,255,0.048)}
.cam-frame video{width:100%;height:100%;object-fit:cover;display:block}
.cam-overlay{position:absolute;inset:0;pointer-events:none}
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#06b6d4,transparent);opacity:0.5;animation:scanDown 4s linear infinite}
@keyframes scanDown{0%{top:0}100%{top:100%}}
.cam-corner{position:absolute;width:13px;height:13px}
.cam-corner.tl{top:9px;left:9px;border-top:1.5px solid #06b6d4;border-left:1.5px solid #06b6d4}
.cam-corner.tr{top:9px;right:9px;border-top:1.5px solid #06b6d4;border-right:1.5px solid #06b6d4}
.cam-corner.bl{bottom:9px;left:9px;border-bottom:1.5px solid #06b6d4;border-left:1.5px solid #06b6d4}
.cam-corner.br{bottom:9px;right:9px;border-bottom:1.5px solid #06b6d4;border-right:1.5px solid #06b6d4}
.cam-hud-top{position:absolute;top:8px;right:9px;display:flex;align-items:center;gap:5px;background:rgba(4,7,14,0.82);backdrop-filter:blur(12px);border:1px solid rgba(6,182,212,0.18);border-radius:5px;padding:3px 9px;font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:#06b6d4}
.cam-hud-bot{position:absolute;bottom:9px;left:9px;right:9px;background:rgba(4,7,14,0.82);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:8px 11px}
.cam-risk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
/* SCORE RING */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 0}
/* MAP */
.map-svg{width:100%;height:420px;display:block;background:#020810;border-radius:8px;border:1px solid rgba(6,182,212,0.1)}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:#607e9a}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* FILTER CHIPS */
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.fchip{padding:3px 10px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:0.59rem;cursor:pointer;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.025);color:#607e9a;transition:all 0.13s}
.fchip:hover{color:#d4e2f0;border-color:rgba(255,255,255,0.12)}

// BACKEND INTEGRATION
// Change API_BASE if your Flask server runs on a different port.
// When backend is offline the app falls back to in-memory mode.
// ═══════════════════════════════════════════════════════════
var API_BASE = 'http://localhost:8000/api';

function apiFetch(path, opts) {
  opts = opts || {};
  return fetch(API_BASE + path, opts)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .catch(function(){ return null; }); // graceful offline fallback
}

// Load all stored detections from DB and seed appState on startup
function loadDbDetections() {
  apiFetch('/detections/?limit=500').then(function(rows) {
    if (!rows) { appState.dbOnline = false; updateDbIndicator(); return; }
    appState.dbOnline = true;
    // Merge DB rows into session detections (avoid dupes by id)
    var existingIds = new Set(appState.detections.map(function(d){ return d.dbId; }).filter(Boolean));
    rows.forEach(function(row) {
      if (existingIds.has(row.id)) return;
      var reasons = row.explanation;
      if (typeof reasons === 'string') { try { reasons = JSON.parse(reasons); } catch(e){ reasons = [reasons]; } }
      appState.detections.push({
        dbId: row.id,
        type: row.detection_type,
        level: row.level,
        verdict: row.verdict,
        city: row.city || '',
        confidence: row.confidence,
        prediction: row.prediction,
        score: row.score,
        reasons: reasons || [],
        time: row.timestamp ? new Date(row.timestamp + 'Z').toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '--:--:--',
        fromDb: true
      });
    });
    // Recompute stats from full list
    appState.stats.threats = appState.detections.length;
    appState.stats.deepfakes = appState.detections.filter(function(d){return d.type==='deepfake';}).length;
    appState.stats.voices    = appState.detections.filter(function(d){return d.type==='voice';}).length;
    appState.stats.phishing  = appState.detections.filter(function(d){return d.type==='phishing';}).length;
    appState.stats.whatsapp  = appState.detections.filter(function(d){return d.type==='whatsapp';}).length;
    appState.stats.website   = appState.detections.filter(function(d){return d.type==='website';}).length;
    updateTopbar();
    updateDbIndicator();
    renderNavBadges();
    // Refresh current page if dashboard or map
    if (appState.page === 'dashboard' || appState.page === 'map' || appState.page === 'history') {
      var area = document.getElementById('page-area');
      if (area) {
        var renderers = {dashboard:renderDashboard, map:renderMap, history:renderHistory};
        if (renderers[appState.page]) area.innerHTML = renderers[appState.page]();
        animateBars();
      }
    }
  });
}

// Send a detection result to the backend API and persist to DB
// type may be "deepfake?city=Bengaluru" for file uploads — we split it
function persistDetection(typeWithParams, payload, isJson) {
  var parts = typeWithParams.split('?');
  var type = parts[0];
  var qs = parts[1] ? '?' + parts[1] : '';
  var endpoint = type === 'website' ? '/detect' : '/analyze';
  var url = API_BASE + '/' + type + endpoint + qs;
  var opts;
  if (isJson) {
    opts = { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) };
  } else {
    opts = { method: 'POST', body: payload }; // payload is FormData
  }
  fetch(url, opts)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data && data.id) {
        // Tag the most recent session detection with its DB id
        var det = appState.detections[0];
        if (det && !det.dbId) det.dbId = data.id;
        appState.dbOnline = true;
      } else {
        appState.dbOnline = false;
      }
      updateDbIndicator();
    })
    .catch(function(){ appState.dbOnline = false; updateDbIndicator(); });
}

// ═══════════════════════════════════════════════════════════
// ANALYSIS ENGINES
// ═══════════════════════════════════════════════════════════
function analyzePhishing(text){
  var lt=text.toLowerCase();
  var U=['urgent','immediately','expires','act now','click here','verify','suspended','blocked','otp','kyc','aadhaar','pan card','upi','paytm','account locked','warning','last chance','24 hours'];
  var F=['bank account','credit card','wire transfer','gift card','payment','refund','tax refund','prize','lottery','sbi','hdfc','icici','rbi','income tax','irctc','neft','ifsc','gpay','phonepe'];
  var uh=U.filter(function(w){return lt.indexOf(w)>=0;});
  var fh=F.filter(function(w){return lt.indexOf(w)>=0;});
  var hasUrl=/https?:\/\/|www\.|\.xyz|\.tk|\.ml/.test(lt);
  var hasCaps=(text.match(/[A-Z]{3,}/g)||[]).length>0;
  var exclaim=text.split('!').length-1;
  var score=0, reasons=[];
  if(uh.length){score+=Math.min(uh.length*14,42);reasons.push('Urgency triggers: '+uh.slice(0,3).join(', '));}
  if(fh.length){score+=Math.min(fh.length*12,36);reasons.push('Financial/brand keywords: '+fh.slice(0,2).join(', '));}
  if(hasUrl){score+=22;reasons.push('Suspicious URL detected in message body');}
  if(hasCaps){score+=9;reasons.push('Aggressive capitalization pattern detected');}
  if(exclaim>3){score+=6;reasons.push(exclaim+' exclamation marks — pressure tactic');}
  if(lt.indexOf('aadhaar')>=0||lt.indexOf('pan card')>=0){score+=10;reasons.push('India identity document request (Aadhaar/PAN)');}
  score=Math.min(Math.round(score),98);
  var level=score>60?'danger':score>28?'warn':'safe';
  return {
    prediction:score>60?'phishing':score>28?'suspicious':'clean',
    score:score, confidence:Math.min(48+score*0.5,97).toFixed(1),
    verdict:score>60?'Phishing Detected':score>28?'Suspicious Message':'Clean Message',
    level:level, reasons:reasons.length?reasons:['No threat indicators found'],
    categories:{'Urgency Language':Math.min(uh.length*22,98),'Financial Request':Math.min(fh.length*20,98),'Link Danger':hasUrl?80:5,'Identity Spoofing':Math.min(score*0.7,96),'Data Harvesting':Math.min(score*0.5,88)}
  };
}

function analyzeWhatsApp(msg){
  var lt=msg.toLowerCase();
  var U=['urgent','immediately','block','suspended','warning','final notice','last chance','deactivat','disconnected'];
  var F=['upi','paytm','gpay','otp','prize','lottery','transfer','bank account','neft','ifsc'];
  var I=['aadhaar','pan','kyc','jio','airtel','bsnl','sbi','hdfc','icici','irctc'];
  var uh=U.filter(function(w){return lt.indexOf(w)>=0;});
  var fh=F.filter(function(w){return lt.indexOf(w)>=0;});
  var ih=I.filter(function(w){return lt.indexOf(w)>=0;});
  var urls=(msg.match(/https?:\/\/\S+|www\.\S+/gi)||[]);
  var suspUrls=urls.filter(function(u){return !/(gov\.in|rbi\.org|npci\.org\.in|uidai\.gov\.in)/.test(u);});
  var score=0, reasons=[];
  if(uh.length){score+=Math.min(uh.length*13,38);reasons.push('Urgency language: '+uh.slice(0,3).join(', '));}
  if(fh.length){score+=Math.min(fh.length*12,34);reasons.push('Financial keywords: '+fh.slice(0,2).join(', '));}
  if(ih.length){score+=Math.min(ih.length*14,30);reasons.push('India fraud pattern: '+ih.slice(0,2).join(', '));}
  if(suspUrls.length){score+=22;reasons.push('Suspicious URL: '+suspUrls[0].slice(0,55));}
  else if(urls.length){score+=10;reasons.push(urls.length+' URL(s) detected in message');}
  score=Math.min(score,98);
  var level=score>58?'danger':score>28?'warn':'safe';
  return {
    prediction:score>58?'scam':score>28?'suspicious':'clean',
    confidence:Math.min(42+score*0.56,97).toFixed(1),
    score:score, verdict:score>58?'WhatsApp Scam Detected':score>28?'Suspicious Message':'Clean Message',
    level:level, reasons:reasons.length?reasons:['No threat indicators found'],
    urls:urls, suspiciousUrl:suspUrls.length>0,
    categories:{'Urgency Language':Math.min(uh.length*20,98),'Financial Keywords':Math.min(fh.length*18,98),'India Fraud Pattern':Math.min(ih.length*20,98),'Suspicious URL':suspUrls.length?86:3,'Social Engineering':0}
  };
}

function analyzeDeepfake(file){
  var seed=0;
  for(var i=0;i<file.name.length;i++) seed+=file.name.charCodeAt(i)*(i+1);
  seed+=file.size%99991;
  var rand=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  var dp=+(20+rand()*76).toFixed(1);
  var conf=+(76+rand()*22).toFixed(1);
  var level=dp>60?'danger':dp>35?'warn':'safe';
  var frames=Math.floor(rand()*260)+28;
  var reasons=dp>55?[
    'GAN fingerprint in byte frequency distribution (entropy ratio anomaly)',
    'Byte histogram variance deviates from authentic video baseline',
    'Synthetic re-encoding pattern detected in file structure',
    'Estimated '+frames+' frames with temporal artifact signatures'
  ]:dp>35?[
    'Minor byte entropy anomaly — inconclusive result',
    'Slight re-compression signature detected'
  ]:[];
  return {
    filename:file.name, prediction:dp>60?'deepfake':dp>35?'suspicious':'authentic',
    confidence:conf, deepfake_probability:dp,
    verdict:dp>60?'Deepfake Detected':dp>35?'Suspicious Content':'Authentic Media',
    level:level, frames_analyzed:frames, reasons:reasons,
    model_scores:{'EfficientNet-B4':+(Math.min(dp*0.97,99)).toFixed(1),'XceptionNet':+(Math.min(dp*0.94,99)).toFixed(1),'FaceForensics++':+(Math.min(dp*0.99,99)).toFixed(1)}
  };
}

function analyzeVoice(file){
  var seed=file.size%88997;
  for(var i=0;i<file.name.length;i++) seed+=file.name.charCodeAt(i)*(i+3);
  var rand=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  var risk=+(10+rand()*85).toFixed(1);
  var auth=+(100-risk).toFixed(1);
  var level=risk>65?'danger':risk>40?'warn':'safe';

    'Waveform variance below natural speech threshold — flat TTS prosody',
    'Zero-crossing rate anomaly — formant irregularity detected',

  ]:risk>35?[
    'Minor pitch quantization anomaly',
    'Slight spectral gap in 6-8 kHz range'
  ]:[];
  return {
    filename:file.name, prediction:risk>65?'synthetic':risk>40?'suspicious':'human',
    scam_risk:risk, authenticity:auth,
    voice_type:risk>60?'AI-Cloned / Synthetic':'Human Voice',

  };
}

var waveT=0, waveAnimId=null;
function drawWave(active){
  var c=document.getElementById('wave-canvas'); if(!c) return;
  if(waveAnimId) cancelAnimationFrame(waveAnimId);
  var ctx=c.getContext('2d');
  var draw=function(){
    c.width=c.offsetWidth*2; c.height=62*2; ctx.scale(2,2);
    ctx.clearRect(0,0,c.offsetWidth,62);
    ctx.strokeStyle=active?'rgba(6,182,212,0.6)':'rgba(255,255,255,0.06)';
    ctx.lineWidth=1.3; ctx.beginPath();
    var w=c.offsetWidth;
    for(var x=0;x<w;x++){
      var v=active?Math.sin(x*0.038+waveT)*15+Math.sin(x*0.1+waveT*1.2)*7+Math.sin(x*0.022+waveT*0.5)*20:Math.sin(x*0.04+waveT)*2;
      x===0?ctx.moveTo(x,31+v):ctx.lineTo(x,31+v);
    }
    ctx.stroke(); waveT+=0.07;
    if(active) waveAnimId=requestAnimationFrame(draw);
  };
  draw();
}

function startLive(){
  appState.liveActive=true; appState.liveRisk=0; appState.liveFrames=0; appState.liveAlerts=[];
  navigator.mediaDevices.getUserMedia({video:true}).then(function(s){
    var v=document.getElementById('live-video'); if(v){v.srcObject=s;v.play();}
  }).catch(function(){});
  var inactive=document.getElementById('cam-inactive'); if(inactive) inactive.style.display='none';
  var hud=document.getElementById('cam-active-hud'); if(hud) hud.style.display='block';
  var startBtn=document.getElementById('live-start-btn'); if(startBtn) startBtn.style.display='none';
  var stopBtn=document.getElementById('live-stop-btn'); if(stopBtn) stopBtn.style.display='inline-flex';
  appState.liveInterval=setInterval(function(){
    var r=6+Math.random()*26+(Math.random()>0.88?42:0);
    appState.liveRisk=+r.toFixed(1); appState.liveFrames++;
    if(r>68) appState.liveAlerts.unshift({t:nowTime(),v:r.toFixed(1)});
    var col=r>65?'#ef4444':r>35?'#f59e0b':'#10b981';
    var st=r>65?'HIGH RISK':r>35?'CAUTION':'CLEAR';
    var rTxt=document.getElementById('cam-risk-txt'); if(rTxt){rTxt.textContent=r.toFixed(1)+'% — '+st;rTxt.style.color=col;}
    var rBar=document.getElementById('cam-risk-bar'); if(rBar){rBar.style.width=r+'%';rBar.className='rbar-fill '+(r>65?'rf-d':r>35?'rf-w':'rf-s');}
    var statsDiv=document.getElementById('live-stats');
    if(statsDiv){
      statsDiv.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+[{l:'Live Risk',v:r.toFixed(1)+'%',c:col},{l:'Frames',v:appState.liveFrames,c:'#d4e2f0'},{l:'Alerts',v:appState.liveAlerts.length,c:appState.liveAlerts.length>0?'#ef4444':'#d4e2f0'},{l:'Status',v:st,c:col}].map(function(m){return '<div class="kpi"><div class="kpi-val" style="color:'+m.c+';font-size:1rem">'+m.v+'</div><div class="kpi-lbl">'+m.l+'</div></div>';}).join('')+'</div>'+(appState.liveAlerts.length>0?'<div class="card"><div class="ch"><div class="ct"><div class="cd" style="background:#ef4444"></div>Alert Log</div><span class="tag t-r">'+appState.liveAlerts.length+'</span></div>'+appState.liveAlerts.slice(0,4).map(function(a){return '<div class="tl-row"><div class="tl-dot" style="background:#ef4444;box-shadow:0 0 5px #ef4444"></div><div class="tl-body"><div class="tl-title" style="color:#ef4444">Risk spike: '+a.v+'%</div><div class="tl-meta">'+a.t+'</div></div></div>';}).join('')+'</div>':'');
    }
  }, 650);
}

function stopLive(){
  appState.liveActive=false; clearInterval(appState.liveInterval);
  var v=document.getElementById('live-video'); if(v&&v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop()});v.srcObject=null;}
  var startBtn=document.getElementById('live-start-btn'); if(startBtn) startBtn.style.display='inline-flex';

yle="font-size:0.72rem;color:#607e9a;margin-left:4px;flex:1">'+c.l+'</span></div><span style="font-family:\'JetBrains Mono\',monospace;font-size:0.64rem;font-weight:600;color:#06b6d4">'+c.v+'</span></div>';}).join('')+'</div></div></div></div>';

function renderChatMessages(){

function sendChatMsg(txt){
  appState.chatMsgs.push({role:'user',text:txt,time:nowTime()});
  appState.chatTyping=true;
  refreshChatWindow();
  setTimeout(function(){
    appState.chatMsgs.push({role:'bot',text:getBotResponse(txt),time:nowTime()});
    appState.chatTyping=false;
    refreshChatWindow();
    var ch=document.getElementById('chat-window'); if(ch) ch.scrollTop=ch.scrollHeight;
  }, 700+Math.random()*500);
}

function sendChat(){
  var inp=document.getElementById('chat-input');
  if(!inp||!inp.value.trim()) return;
  sendChatMsg(inp.value.trim()); inp.value='';
}

function refreshChatWindow(){
  var w=document.getElementById('chat-window');
  if(w){w.innerHTML=renderChatMessages();w.scrollTop=w.scrollHeight;}
}

function renderMap(){
  var dets=appState.detections.filter(function(d){return d.city;});
  var activeFilter=appState.mapFilter;
  var filtered=activeFilter==='all'?dets:dets.filter(function(d){return d.type===activeFilter;});

  // Build city → detections map
  var cityDets={};
  filtered.forEach(function(d){
    if(!CITY_SVG[d.city]) return;
    if(!cityDets[d.city]) cityDets[d.city]=[];
    cityDets[d.city].push(d);
  });

  // State heatmap data
  var stateData={};
  dets.forEach(function(d){
    if(CITY_TO_STATE[d.city]){
      var st=CITY_TO_STATE[d.city];
      stateData[st]=(stateData[st]||0)+1;
    }
  });
  var maxState=Math.max.apply(null,Object.values(stateData).concat([1]));
  var sortedStates=Object.entries(stateData).sort(function(a,b){return b[1]-a[1];});

  var counts={
    total:dets.length,
    phishing:dets.filter(function(d){return d.type==='phishing';}).length,
    voice:dets.filter(function(d){return d.type==='voice';}).length,
    deepfake:dets.filter(function(d){return d.type==='deepfake';}).length,
    whatsapp:dets.filter(function(d){return d.type==='whatsapp';}).length
  };

  // KPI row
  var kpiHtml='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px">';
  [{l:'Total',v:counts.total,c:'#06b6d4'},{l:'Phishing',v:counts.phishing,c:'#06b6d4'},{l:'Voice',v:counts.voice,c:'#f59e0b'},{l:'Deepfake',v:counts.deepfake,c:'#ef4444'},{l:'WhatsApp',v:counts.whatsapp,c:'#25d366'}].forEach(function(k){
    kpiHtml+='<div class="kpi"><div class="kpi-line" style="background:'+k.c+'"></div><div class="kpi-val'+(k.v===0?' dim':'')+'"'+(k.v>0?' style="color:'+k.c+'"':'')+'>'+k.v+'</div><div class="kpi-lbl">'+k.l+'</div></div>';
  });
  kpiHtml+='</div>';

  // Filter chips
  var filterHtml='<div class="filter-row" style="margin-bottom:10px">';
  ['all','phishing','voice','deepfake','whatsapp','website'].forEach(function(f){
    filterHtml+='<button class="fchip'+(activeFilter===f?' on':'')+'" onclick="setMapFilter(\''+f+'\')">'+( f==='all'?'All Types':f.charAt(0).toUpperCase()+f.slice(1))+'</button>';
  });
  filterHtml+='</div>';

  // Build SVG India map
  var svgHtml=buildIndiaSVG(cityDets);

  // Legend
  var legendHtml='<div class="map-legend" style="margin-top:10px">';
  [{c:'#06b6d4',l:'Phishing'},{c:'#f59e0b',l:'Voice Scam'},{c:'#ef4444',l:'Deepfake'},{c:'#25d366',l:'WhatsApp'},{c:'#8b5cf6',l:'Website'}].forEach(function(item){
    legendHtml+='<div class="leg-item"><div class="leg-dot" style="background:'+item.c+';box-shadow:0 0 5px '+item.c+'"></div>'+item.l+'</div>';
  });
  legendHtml+='<div class="leg-item" style="margin-left:auto"><div class="leg-dot" style="background:rgba(96,128,154,0.4)"></div>No detections</div>';
  legendHtml+='</div>';

  // Heatmap
  var heatHtml='';
  if(sortedStates.length===0){
    heatHtml='<div class="empty-note" style="text-align:center;padding:16px 0;font-family:\'JetBrains Mono\',monospace;font-size:0.62rem;color:#344d68;line-height:1.8">No state data yet.<br>Select a city when analyzing to build heatmap.</div>';
  } else {
    sortedStates.forEach(function(entry){
      var st=entry[0], cnt=entry[1];
      var ratio=cnt/maxState;
      var col=ratio>0.7?'#ef4444':ratio>0.4?'#f59e0b':'#06b6d4';
      var bg=ratio>0.7?'rgba(239,68,68,0.09)':ratio>0.4?'rgba(245,158,11,0.07)':'rgba(6,182,212,0.05)';
      var bc=ratio>0.7?'rgba(239,68,68,0.22)':ratio>0.4?'rgba(245,158,11,0.2)':'rgba(6,182,212,0.16)';
      heatHtml+='<div class="heat-row" style="background:'+bg+';border-color:'+bc+'"><span class="heat-nm">'+st+'</span><div class="heat-bar"><div class="heat-fill" style="width:'+(cnt/maxState*100).toFixed(0)+'%;background:'+col+'"></div></div><span class="heat-cnt" style="color:'+col+'">'+cnt+'</span></div>';
    });
  }
  var heatLegendHtml='<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">';
  [{c:'#ef4444',l:'High'},{c:'#f59e0b',l:'Medium'},{c:'#06b6d4',l:'Low'}].forEach(function(h){

  var cityDetEntries=Object.entries(cityDets).sort(function(a,b){return b[1].length-a[1].length;}).slice(0,7);
  var hotspotsHtml='';

    });
  }

  var html='<div class="page"><div class="pg-head" style="display:flex;align-items:flex-start;justify-content:space-between"><div><div class="pg-title">India Cyber Threat Map</div><div class="pg-sub">City markers · State heatmap · Click city dots for detection details · India-only scope</div></div><div class="india-badge">&#127470;&#127475; India Only</div></div>';

      if(detList.length>1){
        svg+='<circle cx="'+(pos.x+r)+'" cy="'+(pos.y-r)+'" r="6.5" fill="#ef4444"/>';
        svg+='<text x="'+(pos.x+r)+'" y="'+(pos.y-r+2.5)+'" text-anchor="middle" font-size="7" fill="white" font-family="monospace" font-weight="700">'+detList.length+'</text>';
      }

    }
    // City name label
    svg+='<text x="'+pos.x+'" y="'+(pos.y-r-4)+'" text-anchor="middle" font-size="'+(hasDet?8.5:7)+'" fill="'+(hasDet?col:'rgba(96,128,154,0.5)')+'" font-family="\'DM Sans\',sans-serif" font-weight="'+(hasDet?600:400)+'">'+city+'</text>';
  });

  svg+='</svg>';
  return svg;
}

// Map tooltip (called from SVG onclick)
var _cityDetsRef={};
function showMapTooltip(event, city){
  var dets=appState.detections.filter(function(d){return d.city===city;});
  if(!dets.length) return;
  var last=dets[0];
  var col=TYPE_COLORS[last.type]||'#06b6d4';
  var rcol=LEVEL_COLORS[last.level]||'#10b981';
  var rlabel=last.level==='danger'?'HIGH RISK':last.level==='warn'?'MEDIUM RISK':'LOW RISK';
  var typeLabels={deepfake:'Deepfake Video',voice:'Voice Scam',phishing:'Phishing',whatsapp:'WhatsApp Scam',website:'Phishing Website'};
  var tt=document.getElementById('map-tooltip');
  if(!tt) return;
  document.getElementById('tt-type').style.color=col;
  document.getElementById('tt-type').textContent=(typeLabels[last.type]||last.type)+' Detected';
  document.getElementById('tt-city').textContent=city;
  document.getElementById('tt-cnt').textContent=dets.length+' detection'+(dets.length!==1?'s':'');
  document.getElementById('tt-time').textContent=last.time;
  var rb=document.getElementById('tt-risk-badge');
  if(rb){rb.style.background=rcol+'20';rb.style.color=rcol;rb.style.border='1px solid '+rcol+'40';rb.textContent=rlabel;}
  tt.style.borderColor=col;
  // Position tooltip correctly using rendered SVG bounding rect
  var container=document.getElementById('map-container');
  var svgEl=document.getElementById('india-svg');
  if(container && svgEl){
    var svgRect=svgEl.getBoundingClientRect();
    var contRect=container.getBoundingClientRect();
    var pos=CITY_SVG[city];
    // SVG viewBox is 0 0 520 600, rendered into actual svgRect dimensions
    var scaleX=svgRect.width/520;
    var scaleY=svgRect.height/600;
    var tx=(pos.x*scaleX)+(svgRect.left-contRect.left)+14;
    var ty=(pos.y*scaleY)+(svgRect.top-contRect.top)-65;
    if(tx+170>contRect.width) tx-=185;
    if(ty<4) ty=4;
    if(ty+130>contRect.height) ty=contRect.height-135;
    tt.style.left=tx+'px'; tt.style.top=ty+'px'; tt.style.display='block';
  }
}

function hideMapTooltip(){
  var tt=document.getElementById('map-tooltip'); if(tt) tt.style.display='none';
}

function setMapFilter(f){
  appState.mapFilter=f;
  var area=document.getElementById('page-area'); if(area) area.innerHTML=renderMap();
  animateBars();
}

function goto(id){
  if(appState.liveActive && id!=='live') stopLive();
  appState.page=id;
  document.querySelectorAll('.nav-item').forEach(function(btn){btn.classList.toggle('active',btn.dataset.page===id);});
  document.getElementById('bc-title').textContent=PAGE_TITLES[id]||id;
  var area=document.getElementById('page-area');
  if(area){
    var renderers={home:renderHome,deepfake:renderDeepfake,voice:renderVoice,phishing:renderPhishing,whatsapp:renderWhatsApp,website:renderWebsite,live:renderLive,dashboard:renderDashboard,history:renderHistory,chatbot:renderChatbot,map:renderMap};
    area.innerHTML=(renderers[id]||renderHome)();
    animateBars();
    if(id==='voice') setTimeout(function(){drawWave(false);},50);
    if(id==='chatbot') setTimeout(function(){var w=document.getElementById('chat-window');if(w)w.scrollTop=w.scrollHeight;},50);
    renderNavBadges();
  }
}

function buildNav(){
  var det=document.getElementById('nav-detect'), intel=document.getElementById('nav-intel');
  NAV.forEach(function(item){
    var btn=document.createElement('button');
    btn.className='nav-item'+(item.id==='home'?' active':'');
    btn.dataset.page=item.id;
    btn.innerHTML='<div class="nav-icon">'+item.icon+'</div>'+item.label;
    btn.onclick=function(){goto(item.id);};
    if(item.sec==='detect') det.appendChild(btn);
    else intel.appendChild(btn);
  });
}

  var cl=document.getElementById('clock');
  if(cl) cl.textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
},1000);

buildNav();
