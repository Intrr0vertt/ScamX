      <div className="grid-2" style={{alignItems:'start'}}>
        <div className="stack">
          <div className="card">
            <div className="card-header">
              <div className="card-title" style={{color:'#25d366'}}>
                <span style={{width:5,height:5,borderRadius:'50%',background:'#25d366',boxShadow:'0 0 7px #25d36688',display:'inline-block'}} />
                Message Input
              </div>
            </div>
            <textarea className="field-textarea mb-8"
              placeholder="Paste a WhatsApp message here — KYC scam, UPI fraud, lottery, OTP theft, bank alert, or any suspicious forward…"
              value={msg}
              onChange={e => { setMsg(e.target.value); if (status === 'done') { setResult(null); setStatus('idle'); }}}
              style={{minHeight:120}}
            />
            <div style={{display:'flex',gap:5,marginBottom:10,flexWrap:'wrap'}}>
              {samples.map(s => (
                <button key={s.label} className="btn btn-ghost btn-xs" onClick={() => { setMsg(s.text); setResult(null); setStatus('idle'); }}>{s.label}</button>
              ))}
            </div>
            <CitySelector value={city} onChange={setCity} />
            <button className="btn btn-cyan" style={{width:'100%',marginTop:10,background:'#25d366',color:'#000'}}
              onClick={analyze} disabled={status==='analyzing'||!msg.trim()}>
              {status==='analyzing' ? '⏳ Analyzing…' : '🔍 Analyze WhatsApp Message'}
            </button>
          </div>

          {msg && (
            <div className="card card-sm">
              <div className="card-header" style={{marginBottom:8}}>
                <div className="card-title" style={{fontSize:'0.58rem'}}>Message Preview</div>
              </div>
              <div className="wa-bubble-wrap">
                <div className="wa-bubble-header">
                  <div className="wa-bubble-avatar">SC</div>
                  <div>
                    <div className="wa-bubble-name">Suspicious Contact</div>
                  </div>
                  <div className="wa-bubble-time">{new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}</div>
                </div>
                <div className="wa-bubble-msg">{msg.substring(0, 180)}{msg.length > 180 ? '…' : ''}</div>
                {(msg.match(/https?:\/\/\S+|www\.\S+/gi) || []).slice(0,3).map((u, i) => (
                  <div key={i} className="wa-url-chip">🔗 {u.substring(0, 40)}{u.length > 40 ? '…' : ''}</div>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="stack">
          {status === 'idle' && (
            <WaitingState icon="📱" title="Waiting for input" desc="Paste a WhatsApp message above and click Analyze. India-specific fraud patterns detected automatically." />
          )}
          {status === 'analyzing' && (
            <div className="card" style={{minHeight:200}}>
              <div className="processing-state" style={{padding:'30px 0'}}>
                <div className="spinner-ring" style={{borderTopColor:'#25d366'}} />
                <div className="processing-label">Analyzing with AI…</div>
                <div className="processing-sub">NLP classifier · Urgency detection · URL reputation · India fraud pattern scan</div>
              </div>
            </div>
          )}
          {status === 'done' && result && (
            <>
              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <span className="card-title-dot" style={{background:result.level==='danger'?'var(--red)':result.level==='warn'?'var(--amber)':'var(--green)'}} />
                    Analysis Result
                  </div>
                  {city && <span className="india-badge">📍 {city}</span>}
                </div>
                <VerdictBanner result={result} scoreKey="score" label="Scam Probability" />
                <RiskBar value={parseFloat(result.score)} label="Threat Score" />
                <div className="row" style={{flexWrap:'wrap',gap:5,marginTop:4}}>
                  <span className="tag tag-dim">Confidence: {result.confidence}%</span>
                  {result.urls.length > 0 && <span className="tag tag-red">{result.urls.length} URL{result.urls.length>1?'s':''} found</span>}
                  {result.suspiciousUrl && <span className="tag tag-red">⚠ Suspicious Domain</span>}
                </div>
              </div>
              <div className="card">
                <div className="card-header">
                  <div className="card-title"><span className="card-title-dot" style={{background:'var(--violet)'}} />Category Scores</div>
                </div>
                {Object.entries(result.categories).map(([name, val]) => {
                  const v = +Math.min(parseFloat(val.toFixed(1)), 99).toFixed(1);
                  const c = v > 60 ? 'var(--red)' : v > 30 ? 'var(--amber)' : 'var(--green)';
                  return (
                    <div key={name} className="conf-item">
                      <div className="conf-header"><span className="conf-name">{name}</span><span className="conf-pct" style={{color:c}}>{v.toFixed(1)}%</span></div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${v}%`,background:c,opacity:0.82}} /></div>
                    </div>
                  );
                })}
              </div>
              <div className="card">
                <div className="card-header">
                  <div className="card-title"><span className="card-title-dot" style={{background:'var(--amber)'}} />Threat Indicators</div>
                  <span className={`tag ${result.level==='safe'?'tag-green':'tag-amber'}`}>{result.reasons.length} found</span>
                </div>
                <div className="flags-list">
                  {result.reasons.map((r, i) => (
                    <div key={i} className="flag-item">
                      <div className={`flag-sev ${result.level==='danger'?'high':result.level==='warn'?'medium':'low'}`} />
                      <div className="flag-text">{r}</div>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   WEBSITE PHISHING SCREENSHOT DETECTOR PAGE
   ═══════════════════════════════════════════════════════════ */
function WebsitePage({ onDetection }) {
  const [file, setFile]     = useState(null);
  const [preview, setPreview] = useState(null);
  const [status, setStatus] = useState('idle');
  const [result, setResult] = useState(null);
  const [city, setCity]     = useState('');
  const [drag, setDrag]     = useState(false);
  const fRef = useRef();

  const analyze = async (f) => {
    setFile(f); setStatus('analyzing'); setResult(null);
    const reader = new FileReader();
    reader.onload = e => setPreview(e.target.result);
    reader.readAsDataURL(f);
    await new Promise(r => setTimeout(r, 2600));
    const res = runWebsiteAnalysis(f.name);
    setResult(res); setStatus('done');
    onDetection && onDetection({ type: 'website', level: res.level, verdict: res.verdict, city });
  };
  const reset = () => { setFile(null); setPreview(null); setResult(null); setStatus('idle'); setCity(''); };

  return (
    <div className="page-enter">
      <div className="page-head">
        <div className="page-head-row">
          <div>
            <div className="page-title">Website Scam Detector</div>
            <div className="page-subtitle">Screenshot analysis · Fake login forms · Brand impersonation · Domain age check · SSL verification</div>
          </div>
          {result && (
            <div className="row">
              <span className={`tag ${result.level==='danger'?'tag-red':result.level==='warn'?'tag-amber':'tag-green'}`}>{result.verdict}</span>
              <button className="btn btn-ghost btn-sm" onClick={reset}>↺ Reset</button>
            </div>
          )}
        </div>
      </div>
      <div className="grid-2" style={{alignItems:'start'}}>
        <div className="stack">
          <div className="card">
            <div className="card-header">
              <div className="card-title"><span className="card-title-dot" style={{background:'var(--violet)'}} />Upload Website Screenshot</div>
            </div>
            {status !== 'analyzing' ? (
              <div className={`upload-zone ${drag?'drag':''}`}
                onDragOver={e=>{e.preventDefault();setDrag(true)}}
                onDragLeave={()=>setDrag(false)}
                onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)analyze(f);}}
                onClick={()=>fRef.current.click()}>
                <input ref={fRef} type="file" accept="image/*" style={{display:'none'}}
                  onChange={e=>e.target.files[0]&&analyze(e.target.files[0])} />
                <div className="upload-icon">🖼️</div>
                <h4>Drop a website screenshot here</h4>
                <p>PNG, JPG, WEBP · Take a screenshot of any suspicious site · <em>or click to browse</em></p>
              </div>
            ) : (
              <div className="processing-state">
                <div className="spinner-ring" />
                <div className="processing-label">Analyzing with AI…</div>
                <div className="processing-sub">Scanning for fake login forms · Brand matching · Domain analysis</div>
              </div>
            )}

              <div style={{marginTop:10}}>

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
function ThreatPredictions({ detections }) {
  const [loading, setLoading] = useState(false);
  const [preds, setPreds]     = useState(null);

  const basePreds = [
    { icon:'🎭', title:'Deepfake Political Disinformation Surge', body:'State-actor campaigns using next-gen GAN architectures for regional language deepfakes targeting elections. Rise of 218% detected in Q1 2025.', lvl:'high', prob: 91 },
    { icon:'🎙️', title:'Voice Cloning in Banking (UPI/IVR)', body:'AI voice synthesis attacks impersonating SBI, HDFC, and Paytm customer care rising rapidly. Vishing campaigns up 340% targeting metro cities.', lvl:'high', prob: 88 },
    { icon:'📱', title:'WhatsApp KYC Fraud Escalation', body:'Fake TRAI/Jio/Airtel KYC deactivation messages increasing with personalized targeting using leaked telecom databases.', lvl:'medium', prob: 74 },
    { icon:'💸', title:'UPI QR Code Impersonation', body:'Scammers embedding malicious QR codes in paper flyers near ATMs and shops. Collect-vs-Pay screen confusion attacks rising.', lvl:'medium', prob: 68 },
    { icon:'🌐', title:'Bank Website Clone Attacks', body:'Phishing sites mimicking SBI NetBanking and HDFC increasing with convincing typosquat domains. Average victim loses ₹47,000.', lvl:'medium', prob: 62 },
    { icon:'🆔', title:'Aadhaar/PAN KYC Phishing', body:'Personalized spear-phishing using leaked Aadhaar data. LLM-generated content in Hindi, Tamil, Telugu evading traditional filters.', lvl:'low', prob: 45 },
  ];

  const generatePredictions = async () => {
    setLoading(true);
    await new Promise(r => setTimeout(r, 1800));
    // Augment base predictions with session data
    const sessionTypes = detections.reduce((a, d) => { a[d.type] = (a[d.type]||0)+1; return a; }, {});
    const augmented = basePreds.map(p => ({
      ...p,
      prob: Math.min(p.prob + (sessionTypes[p.icon==='🎭'?'deepfake':p.icon==='🎙️'?'voice':'phishing']||0)*3, 99),
    }));
    setPreds(augmented);
    setLoading(false);
  };

  if (!preds) return (
    <div className="waiting-state">
      <div className="waiting-icon">🔮</div>
      <div className="waiting-title">AI Threat Predictions</div>
      <div className="waiting-desc">Analyze current threats to generate AI-powered predictions for India's cyber landscape</div>
      <button className="btn btn-cyan btn-sm" style={{marginTop:8}} onClick={generatePredictions} disabled={loading}>
        {loading ? '⏳ Generating…' : '🔮 Generate Predictions'}
      </button>
    </div>
  );

  return (
    <div>
      <div className="card-header" style={{marginBottom:12}}>
        <div className="card-title"><span className="card-title-dot" style={{background:'var(--amber)'}} />AI Threat Predictions — India 2025</div>
        <div className="row">
          <span className="tag tag-violet">AI MODEL</span>
          <button className="btn btn-ghost btn-xs" onClick={() => setPreds(null)}>↺</button>
        </div>
      </div>
      {preds.map((p, i) => (
        <div key={i} className={`trend-card ${p.lvl}`}>
          <div className="trend-icon">{p.icon}</div>
          <div style={{flex:1}}>
            <div className="trend-eyebrow">◈ {p.lvl === 'high' ? 'HIGH RISK' : p.lvl === 'medium' ? 'MEDIUM RISK' : 'MODERATE'} · {p.prob}% probability</div>
            <div className="trend-title">{p.title}</div>
            <div className="trend-body">{p.body}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   INDIA STATE HEATMAP COMPONENT
   ═══════════════════════════════════════════════════════════ */
function StateHeatmap({ detections }) {
  // Build state counts from actual detections
  const stateData = {};
  detections.forEach(d => {
    if (d.city && CITY_TO_STATE[d.city]) {
      const state = CITY_TO_STATE[d.city];
      stateData[state] = (stateData[state] || 0) + 1;
    }
  });
  const maxCount = Math.max(...Object.values(stateData), 1);
  const sorted = Object.entries(stateData).sort((a, b) => b[1] - a[1]);

  const getHeatColor = (count, max) => {
    const ratio = count / max;
    if (ratio > 0.7) return { bg:'rgba(239,68,68,0.15)', bar:'var(--red)', text:'var(--red)' };
    if (ratio > 0.4) return { bg:'rgba(245,158,11,0.12)', bar:'var(--amber)', text:'var(--amber)' };
    return { bg:'rgba(6,182,212,0.08)', bar:'var(--cyan)', text:'var(--cyan)' };
  };

  if (sorted.length === 0) return (
    <div style={{textAlign:'center',padding:'24px 0',color:'var(--text-3)',fontFamily:'JetBrains Mono,monospace',fontSize:'0.67rem'}}>
      — No state data yet — Select a city when analyzing to build heatmap —
    </div>
  );

  return (
    <div>
      {sorted.map(([state, count]) => {
        const heat = getHeatColor(count, maxCount);
        return (
          <div key={state} className="heat-state" style={{background:heat.bg, border:`1px solid ${heat.bar}22`}}>
            <div className="heat-state-name">{state}</div>
            <div className="heat-state-bar" style={{background:`rgba(255,255,255,0.04)`, borderRadius:100}}>
              <div style={{width:`${(count/maxCount*100).toFixed(0)}%`, height:'100%', borderRadius:100, background:heat.bar, transition:'width 1s ease'}} />
            </div>
            <div className="heat-state-count" style={{color:heat.text}}>{count}</div>
          </div>
        );
      })}
      <div style={{marginTop:10,display:'flex',gap:8,flexWrap:'wrap'}}>
        {[{c:'var(--red)',l:'High Activity'},{c:'var(--amber)',l:'Medium'},{c:'var(--cyan)',l:'Low'}].map(h=>(
          <div key={h.l} className="heat-legend" style={{background:`${h.c}10`,border:`1px solid ${h.c}22`,color:h.c}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:h.c,display:'inline-block',boxShadow:`0 0 5px ${h.c}`}} />
            {h.l}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PERSISTENT STORAGE HELPERS
   ═══════════════════════════════════════════════════════════ */
const DB_KEY = (user) => `cybershield_v3_${user}`;

function loadUserData(username) {
  try {
    const raw = localStorage.getItem(DB_KEY(username));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function saveUserData(username, detections, stats) {
  try {
    localStorage.setItem(DB_KEY(username), JSON.stringify({
      detections, stats, savedAt: new Date().toISOString()
    }));
  } catch (e) { console.warn('Storage error:', e); }
}

function App() {
  const [currentUser, setCurrentUser] = React.useState(null);
  const [page, setPage] = useState('home');
  const [stats, setStats] = useState({ threats: 0, deepfakes: 0, voices: 0, phishing: 0, whatsapp: 0, website: 0 });
  const [detections, setDetections] = useState([]);

  /* ── Login handler — loads stored data ── */
  const handleLogin = (username) => {
    setCurrentUser(username);
    const saved = loadUserData(username);
    if (saved) {
      setDetections(saved.detections || []);
      setStats(saved.stats || { threats: 0, deepfakes: 0, voices: 0, phishing: 0, whatsapp: 0, website: 0 });
    } else {
      setDetections([]);
      setStats({ threats: 0, deepfakes: 0, voices: 0, phishing: 0, whatsapp: 0, website: 0 });
    }
    setPage('home');
  };

  /* ── Logout ── */
  const handleLogout = () => {
    setCurrentUser(null);
    setPage('home');
    setDetections([]);
    setStats({ threats: 0, deepfakes: 0, voices: 0, phishing: 0, whatsapp: 0, website: 0 });
  };

  /* ── Save on every detection ── */
  const handleDetection = useCallback((info) => {
    const det = {
      ...info,
      time: new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false }),
      date: new Date().toLocaleDateString('en-IN'),
    };
    setDetections(prev => {
      const next = [det, ...prev];
      setStats(s => {
        const n = { ...s }; n.threats += 1;
        if (info.type === 'deepfake')  n.deepfakes += 1;
        else if (info.type === 'voice')    n.voices    += 1;
        else if (info.type === 'phishing') n.phishing  += 1;
        else if (info.type === 'whatsapp') n.whatsapp  += 1;
        else if (info.type === 'website')  n.website   += 1;
        if (currentUser) saveUserData(currentUser, next, n);
        return n;
      });
      return next;
    });
  }, [currentUser]);

  if (!currentUser) return <LoginScreen onLogin={handleLogin} />;

  const renderPage = () => {
    switch (page) {
      case 'home':      return <HomePage      setPage={setPage} stats={stats} detections={detections} />;
      case 'deepfake':  return <DeepfakePage  onDetection={handleDetection} />;
      case 'voice':     return <VoicePage     onDetection={handleDetection} />;
      case 'phishing':  return <PhishingPage  onDetection={handleDetection} />;
      case 'whatsapp':  return <WhatsAppPage  onDetection={handleDetection} />;
      case 'website':   return <WebsitePage   onDetection={handleDetection} />;
      case 'live':      return <LivePage />;
      case 'dashboard': return <DashboardPage stats={stats} detections={detections} />;
      case 'chatbot':   return <ChatbotPage />;
      case 'map':       return <IndiaMapPage  detections={detections} />;
      default:          return <HomePage      setPage={setPage} stats={stats} detections={detections} />;
    }
  };

  return (
    <div className="shell">
      {/* ═══ SIDEBAR ═══ */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-mark">
            <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
              <path d="M8 1.5L13.5 4.2v3.8c0 3.2-2.2 5.5-5.5 6.5C4.7 13.5 2.5 11.2 2.5 8V4.2L8 1.5z" fill="rgba(4,7,14,0.8)" stroke="rgba(4,7,14,0.6)" strokeWidth="0.5" />
              <path d="M5.8 8.2l1.7 1.7 2.9-2.9" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </div>
          <div>
            <div className="logo-text">Cyber<b>Shield</b> AI</div>
            <div className="logo-sub">India Threat Intel</div>
          </div>
        </div>

        <div className="sidebar-section-label">Detection</div>
        {NAV.filter(n => n.sec === 0).map(n => (
          <button key={n.id} className={`nav-item ${page === n.id ? 'active' : ''}`} onClick={() => setPage(n.id)}>
            <div className="nav-icon">{n.icon}</div>
            {n.label}
          </button>
        ))}

        <div className="sidebar-divider" />
        <div className="sidebar-section-label">Intelligence</div>
        {NAV.filter(n => n.sec === 1).map(n => (
          <button key={n.id} className={`nav-item ${page === n.id ? 'active' : ''}`} onClick={() => setPage(n.id)}>
            <div className="nav-icon">{n.icon}</div>
            {n.label}
            {n.id === 'map' && detections.filter(d=>d.city).length > 0 && (
              <span style={{marginLeft:'auto',fontFamily:'JetBrains Mono,monospace',fontSize:'0.55rem',background:'rgba(249,115,22,0.15)',border:'1px solid rgba(249,115,22,0.25)',color:'var(--orange)',padding:'1px 5px',borderRadius:'100px'}}>
                {detections.filter(d=>d.city).length}
              </span>
            )}
          </button>
        ))}

        <div className="sidebar-footer">
          {/* User info */}
          <div style={{marginBottom:8,padding:'6px 0',borderBottom:'1px solid var(--rim)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:'0.72rem',fontWeight:600,color:'var(--text-1)'}}>👤 {currentUser}</div>
              <div style={{fontSize:'0.58rem',color:'var(--text-3)',fontFamily:'JetBrains Mono,monospace'}}>
                {detections.length} scan{detections.length!==1?'s':''} stored
              </div>
            </div>
            <button className="btn btn-ghost btn-xs" onClick={handleLogout} style={{fontSize:'0.6rem',padding:'2px 7px'}}>
              Logout
            </button>
          </div>
          <div className="status-pill">
            <div className="pulse-dot" />
            All systems operational
          </div>
          <div className="sb-version">
            <span>v3.0.0 · India Edition</span>
            <span style={{color:'rgba(6,182,212,0.5)'}}>AI READY</span>
          </div>
        </div>
      </aside>

      {/* ═══ MAIN ═══ */}
      <div className="main-wrap">
        <header className="topbar">
          <div className="topbar-left">
            <div className="breadcrumb">
              <span>CyberShield</span>
              <span className="bc-sep">/</span>
              <span className="bc-cur">{PAGE_TITLES[page]}</span>
            </div>
            <span className="india-badge" style={{marginLeft:4}}>🇮🇳 India</span>
          </div>
          <div className="topbar-right">
            {stats.threats > 0 ? (
              <div className="threat-badge alert">
                <span className="pulse-dot danger" style={{width:6, height:6}} />
                {stats.threats} threat{stats.threats !== 1 ? 's' : ''} detected
              </div>
            ) : (
              <div className="threat-badge clean">
                <span className="pulse-dot" style={{width:6, height:6}} />
                No threats detected
              </div>
            )}
            <Clock />
          </div>
        </header>

        <div className="page-area">
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
